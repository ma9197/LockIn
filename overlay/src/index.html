<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>LockIn Overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body class="hidden">
<div class="ov" id="ov">
  <div class="row grind">
    <span class="dot"></span>
    <span class="tm" id="gTime">0:00</span>
    <div class="lab"><b id="gLabel">Grinding</b><span class="pill" id="gTask"><em>🔥</em> Grind</span></div>
  </div>
  <div class="row tmr" id="tmr">
    <span class="ring"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10.5" fill="none" stroke="#232C3E" stroke-width="4"/><circle class="p" cx="13" cy="13" r="10.5" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round" stroke-dasharray="65.97" stroke-dashoffset="0"/></svg></span>
    <span class="tv" id="tv">25:00</span>
    <span class="ts" id="ts">Focus</span>
  </div>
</div>
<script src="app.js"></script>
</body></html>
