[package]
name = "lockin-overlay"
version = "1.0.4"
description = "LockIn desktop overlay: the live grind session and focus timer, floating over any app"
authors = ["LockIn contributors"]
license = "MIT"
repository = "https://github.com/ma9197/LockIn"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lockin_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
